[project]
name = "hfdownload"
version = "0.1.0"
description = "Web tool for downloading models from HuggingFace and ModelScope"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "aiosqlite>=0.20.0",
    "tortoise-orm>=0.24.0",
    "tzdata>=2024.1",
    "modelscope>=1.20.0",
    "huggingface_hub>=0.27.0",
    "python-dotenv>=1.0.0",
    "sse-starlette>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.scripts]
model-download = "app.cli:main"

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF005", "RUF006"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
